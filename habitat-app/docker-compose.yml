services:
  nextjs-app:
    # Built and pushed separately — see mongo-init/ and .env.local.example
    # for the rest of what devops needs alongside this file. This image must
    # be (re)built from THIS branch before deploying — it is not the same
    # codebase as any previously pushed amsingh2/habitat-app image.
    # Pin a released tag per deploy so there is something to roll back to:
    #   APP_IMAGE_TAG=1.0.0 docker compose up -d
    # (read from the shell or a `.env` file beside this compose file — not
    # from .env.local, which only sets variables inside the container.)
    image: amsingh2/habitat-app:${APP_IMAGE_TAG:-latest}
    container_name: nextjs-app
    ports:
      # Bound to loopback: the app speaks plain HTTP and must not be reachable
      # from the internet directly, bypassing TLS. The reverse proxy in front
      # connects either via 127.0.0.1:3001 (proxy on the host) or over
      # app-network (proxy in a container).
      - "127.0.0.1:3001:3001"
    env_file:
      - .env.local
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/habitat_db?directConnection=true&serverSelectionTimeoutMS=2000
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./public/uploads:/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  mongodb:
    # Pinned: a future `docker compose pull` picking up a new major version
    # would refuse to start against data files written by this one.
    image: mongo:8.0
    container_name: mongodb
    volumes:
      - mongodb_data:/data/db
      # Restore script + dump only run automatically the FIRST time the
      # mongodb_data volume is empty (fresh DB). Safe to leave mounted.
      - ./mongo-init/init-restore.sh:/docker-entrypoint-initdb.d/init-restore.sh:ro
      - ./mongo-dump:/docker-entrypoint-initdb.d/dump:ro
# No external port mapping needed
    # ports:
    #   - "27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local